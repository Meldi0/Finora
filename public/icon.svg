<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Multi-Gradient -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF758C" />
      <stop offset="45%" stopColor="#FF6584" />
      <stop offset="100%" stopColor="#FFA94D" />
    </linearGradient>

    <!-- Emerald Teal Accent Ribbon -->
    <linearGradient id="pwaRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#368F7B" />
      <stop offset="100%" stopColor="#52B788" />
    </linearGradient>

    <!-- Glass Rim Shimmer -->
    <linearGradient id="pwaGlassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#FFFFFF" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.3" />
    </linearGradient>

    <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" floodColor="#FF6584" floodOpacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#pwaBgGrad)"
    filter="url(#pwaShadow)"
  />

  <!-- Top Glass Rim Highlight -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="110"
    fill="none"
    stroke="url(#pwaGlassRim)"
    stroke-width="4"
  />

  <!-- Stylized Finora "F" Curves -->
  <!-- Main Vertical Stem with Bulb Loop -->
  <path
    d="M 176 128 C 176 120 184 112 192 112 L 320 112 C 348 112 368 132 368 160 C 368 188 348 208 320 208 L 240 208 L 240 256 L 304 256 C 324 256 340 272 340 292 C 340 312 324 328 304 328 L 240 328 L 240 384 C 240 396 230 406 218 406 C 206 406 196 396 196 384 L 196 148 C 196 136 186 128 176 128 Z"
    fill="#FFFFFF"
    opacity="0.95"
  />

  <!-- Flowing Modern Mint Sage Accent Ribbon -->
  <path
    d="M 240 208 C 280 208 340 220 340 264 C 340 300 296 328 240 328 Z"
    fill="url(#pwaRibbonGrad)"
    opacity="0.9"
  />

  <!-- Sparkle Star at Top Right -->
  <path
    d="M 368 112 Q 368 144 400 144 Q 368 144 368 176 Q 368 144 336 144 Q 368 144 368 112 Z"
    fill="#FFFFFF"
    opacity="0.95"
  />
</svg>
